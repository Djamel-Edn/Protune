# Fly.io deployment for the Protune API.
# Create the app once with:  fly launch --no-deploy --copy-config
# Then deploy with:          fly deploy

app = "protune-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle: the free allowance is not burned overnight.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pretty = false

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
