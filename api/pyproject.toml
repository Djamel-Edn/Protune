[project]
name = "protune-api"
version = "0.1.0"
description = "Protune API — CV tailoring and cover letter generation"
requires-python = ">=3.12"

# Single source of truth for runtime dependencies.
# Vercel installs from this list; a requirements.txt alongside it would be ignored.
dependencies = [
    "fastapi==0.115.6",
    # Plain uvicorn, not [standard]: the serverless runtime imports the ASGI app
    # directly and never starts a server, so uvloop/httptools/watchfiles would be
    # native-wheel bloat in the function bundle. Only local runs use uvicorn.
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    # Generates the PDF fixtures used by the CV parser tests.
    "reportlab==4.2.5",
]

# Vercel loads this module:variable pair as the serverless handler.
[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
